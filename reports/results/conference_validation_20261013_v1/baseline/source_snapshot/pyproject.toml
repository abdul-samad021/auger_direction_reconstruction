[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auger-direction-reconstruction"
version = "0.1.0"
description = "Reconstruct Pierre Auger cosmic-ray arrival directions from surface-detector timing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
]

[project.scripts]
auger = "auger_reco.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auger_reco"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

